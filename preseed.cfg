# Preseed for the offline installer - DUAL MODE (interactive + unattended) - TOTAL OFFLINE.
# All key questions have pre-filled defaults: English/India/US keyboard,
# hostname X3MOS, blank domain, NO mirror (offline disk only), root/user
# x3m / x3m@root, atomic single-partition on first disk, skip popcon,
# grub-pc on first disk. Installer runs totally offline from disk, no network.
#
# Boot labels in isolinux.cfg:
#   install       = interactive (preseed/file=/preseed.cfg vga=788) - shows
#                   questions with defaults pre-filled, user presses Enter.
#   installserial = same but on serial console (ttyS0)
#   auto          = UNATTENDED (auto=true priority=critical console=ttyS0) -
#                   NO prompts, fully automatic when all defaults present.
#
# The default boot is chosen at ISO build time by scripts/assemble-offline.sh:
#   if .config.offline exists (created by `make denuconfig` / denuconfig.sh --offline)
#   then default = auto (unattended, 5s timeout); else default = install (10s).
# So: when you have all default values for each step (denuconfig --offline),
# the install proceeds unattended with zero prompts.
#
# To force unattended without .config.offline: edit isolinux.cfg ontimeout
# or boot with: auto=true priority=critical preseed/file=/preseed.cfg

# --- Localization: English language, India country, US keyboard (auto-skipped) ---
# These values are also passed on the kernel command line (debian-installer/language,
# debian-installer/country, debian-installer/locale, locale) via isolinux.cfg so
# the very early localechooser screens are skipped even in interactive mode.
# The localechooser keys ensure the installer never shows "Select a language"
# or "Select your location" - they default to en / IN / en_US.UTF-8.
d-i debian-installer/language string en
d-i debian-installer/language seen true
d-i debian-installer/country string IN
d-i debian-installer/country seen true
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/locale seen true
d-i localechooser/preferred-locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8

# Keyboard configuration: American English
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/xkb-keymap seen true
d-i keyboard-configuration/modelcode string pc105
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/variantcode string

# --- Timezone (UTC default) ---
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false

# --- Network hardware detection (OFFLINE - no network required) ---
# Fully offline: disable network entirely, never attempt DHCP.
# These are marked seen=true so even at high priority they are skipped,
# and netcfg/enable=false is also passed on kernel cmdline (see isolinux.cfg)
# to prevent any DHCP attempt before preseed is loaded.
d-i netcfg/enable boolean false
d-i netcfg/enable seen true
d-i netcfg/choose_interface select auto
d-i netcfg/choose_interface seen true
d-i netcfg/get_hostname string X3MOS
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain string
d-i netcfg/get_domain seen true
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_failed seen true
d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/dhcp_options seen true
d-i netcfg/no_default_route boolean true
d-i hw-detect/load_firmware boolean true
d-i hw-detect/load_firmware seen true

# --- Mirror: OFFLINE - no network, use only disk (cdrom pool) ---
# Fully offline: installer runs from CD only, no mirror step shown.
# Protocol = cdrom: choose-mirror detects /cdrom/.disk/base_installable and
# uses the CD as the package source. No wget, no network at all.
# apt-setup is disabled to keep target offline.
# Marked seen=true so even interactive mode skips the mirror screen.
d-i mirror/country string IN
d-i mirror/country seen true
d-i mirror/protocol select cdrom
d-i mirror/protocol seen true
# These are only used if a network protocol were somehow selected; harmless.
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string empty
d-i mirror/suite string trixie
d-i mirror/suite seen true
d-i mirror/udeb/suite string trixie
d-i mirror/udeb/suite seen true
d-i mirror/codename string trixie
d-i mirror/codename seen true
# Ensure apt-setup does NOT try to use a network mirror at all.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/use_mirror seen true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-first seen true
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-next seen true
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/cdrom/set-failed seen true
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/disable-cdrom-entries seen true
d-i apt-setup/services-select multiselect
d-i apt-setup/services-select seen true
d-i apt-setup/security_host string
d-i apt-setup/security_path string
d-i apt-setup/non-free boolean false
d-i apt-setup/non-free seen true
d-i apt-setup/non-free-firmware boolean false
d-i apt-setup/non-free-firmware seen true
d-i apt-setup/contrib boolean false
d-i apt-setup/contrib seen true
d-i apt-setup/enable-source-repositories boolean false
d-i apt-setup/enable-source-repositories seen true
d-i debian-installer/allow_unauthenticated boolean true
d-i base-installer/use_mirror boolean false

# --- Installer components (anna): ALWAYS load from the CD-ROM ---
# The CD actually contains the udeb pool (pool/main/...) + the index at
# dists/trixie/main/debian-installer/binary-amd64/Packages, and the initrd
# bundles cdrom-retriever. Force anna to use it (never net-retriever).
d-i anna/retriever string cdrom-retriever
d-i anna/retriever seen true
d-i anna/choose_modules string
d-i anna/choose_modules seen true

# --- Kernel modules come from the CD's kernel-image udeb ---
d-i anna/no_kernel_modules boolean false
d-i anna/no_kernel_modules seen true

# --- Partitioning: guided entire disk, all files in one partition (atomic) ---
# UNATTENDED-ready: auto-detects first disk (sda/vda/nvme) and auto-removes LVM/MD
# so no disk-selection prompt appears even with priority=critical.
# All partman questions marked seen=true for unattended.
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i partman-auto/disk string /dev/sda
d-i partman-auto/disk seen true
d-i partman-auto/method string regular
d-i partman-auto/method seen true
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/choose_recipe seen true
d-i partman-auto/init_automatically_partition select Guided - use entire disk
d-i partman-auto/init_automatically_partition seen true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/device_remove_lvm seen true
d-i partman-md/device_remove_md boolean true
d-i partman-md/device_remove_md seen true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm seen true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/confirm_nooverwrite seen true
d-i partman/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label seen true
d-i partman/choose_partition select finish
d-i partman/choose_partition seen true
d-i partman/confirm boolean true
d-i partman/confirm seen true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite seen true

# --- Users: root and x3m with password x3m@root ---
d-i passwd/root-password password x3m@root
d-i passwd/root-password seen true
d-i passwd/root-password-again password x3m@root
d-i passwd/root-password-again seen true
d-i passwd/user-fullname string x3m
d-i passwd/user-fullname seen true
d-i passwd/username string x3m
d-i passwd/username seen true
d-i passwd/user-password password x3m@root
d-i passwd/user-password seen true
d-i passwd/user-password-again password x3m@root
d-i passwd/user-password-again seen true
d-i passwd/user-default-groups string sudo
d-i passwd/root-login boolean true
d-i passwd/root-login seen true

# --- Bootloader: grub-pc on first available disk ---
d-i grub-installer/bootdev string default
d-i grub-installer/bootdev seen true
d-i grub-installer/only_debian boolean true
d-i grub-installer/only_debian seen true

# --- Popularity contest: skip (No) ---
d-i popularity-contest popularity-contest/participate boolean false
d-i popularity-contest popularity-contest/participate seen true

# --- Package selection: barebone base only ---
# (install-recommends=false keeps base-installer strictly inside the
#  on-disc pool — nothing may be fetched from a mirror during install.)
# tasksel/first is empty AND marked seen so the interactive software-
# selection screen is skipped entirely: the default "standard system
# utilities" task would otherwise be pre-checked and pull >100 packages
# that are not on the offline CD (pool would fail at pkgsel).
tasksel tasksel/first multiselect
tasksel tasksel/first seen true
d-i pkgsel/include string sudo iputils-ping bind9-dnsutils isc-dhcp-client dhcpcd-base net-tools curl wget traceroute ethtool tcpdump netcat-openbsd openssh-client systemd-resolved systemd-timesyncd
d-i pkgsel/upgrade select none
d-i pkgsel/upgrade seen true
d-i base-installer/install-recommends boolean false

# --- pkgsel/tasksel must NEVER touch the network or apt sources ---
# tasksel runs an implicit `apt-get update` against the sources written by
# apt-setup; with a `deb cdrom:` source and the CD already unmounted that
# update can block forever on VirtualBox CD controllers (the "Scanning the
# mirror / Running setup" freeze). No tasks are needed, so disable tasksel
# and the upgrade pass outright: pkgsel then falls through instantly to the
# GRUB boot-loader step (grub-installer).
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/run_tasksel seen true
d-i pkgsel/update-policy select none
d-i pkgsel/update-policy seen true

# --- Automatic (unattended) mode helpers ---
# When booted with auto=true priority=critical, d-i runs non-interactively
# and uses these defaults without showing questions.
d-i debconf/priority select critical
d-i debconf/priority seen true
d-i auto-install/enable boolean true
d-i auto-install/enable seen true

# Serial console for the installed system (headless/VM use) + login prompt
# observable over ttyS0, then apply the chroot/ overlay (files copied verbatim
# onto the target; overlay wins over the offline apt defaults below).
# NOTE: never put a '#' comment inside this backslash-continued command list -
# preseed joins the lines, so a '#' would comment out every following line.
d-i preseed/late_command string \
    in-target systemctl enable serial-getty@ttyS0.service ; \
    mkdir -p /target/etc/systemd/network ; \
    printf '%s\n' '[Match]' 'Name=*' '' '[Network]' 'DHCP=yes' > /target/etc/systemd/network/10-dhcp-all.network ; \
    in-target systemctl enable systemd-networkd systemd-resolved >/dev/null 2>&1 || true ; \
    mkdir -p /target/etc/systemd/system/multi-user.target.wants ; \
    ln -sf /usr/lib/systemd/system/systemd-networkd.service /target/etc/systemd/system/multi-user.target.wants/systemd-networkd.service ; \
    ln -sf /usr/lib/systemd/system/systemd-resolved.service /target/etc/systemd/system/multi-user.target.wants/systemd-resolved.service ; \
    ln -sf /run/systemd/resolve/stub-resolv.conf /target/etc/resolv.conf ; \
    in-target usermod -aG sudo x3m 2>/dev/null || true ; \
    in-target sh -c 'printf "root:x3m@root\n" | chpasswd' ; \
    in-target sh -c 'printf "x3m:x3m@root\n" | chpasswd' ; \
    printf '%s\n' 'GRUB_CMDLINE_LINUX="console=ttyS0,115200n8 console=tty0"' >> /target/etc/default/grub ; \
    printf '%s\n' 'GRUB_CMDLINE_LINUX_DEFAULT=""' >> /target/etc/default/grub ; \
    printf '%s\n' 'GRUB_TERMINAL_INPUT="console serial"' 'GRUB_TERMINAL_OUTPUT="console serial"' 'GRUB_SERIAL_COMMAND="serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1"' >> /target/etc/default/grub ; \
    in-target update-grub ; \
    in-target sh -c 'sed -i "s/^deb/#deb/" /etc/apt/sources.list 2>/dev/null || true' ; \
    in-target sh -c 'sed -i "s/^deb/#deb/" /etc/apt/sources.list.d/*.list 2>/dev/null || true' ; \
    in-target sh -c 'echo "# deb cdrom:[Debian trixie offline] trixie main" > /etc/apt/sources.list.d/cdrom.list' ; \
    sh -c 'ls /overlay/etc/apt >/dev/null 2>&1 && cp -a /overlay/. /target/ || echo "WARN: /overlay missing or empty - target overlay skipped" >&2' ; \
    sh -c 'echo 1 > /proc/sys/dev/cdrom/autoeject 2>/dev/null || true ; umount /cdrom 2>/dev/null || true ; sync' ; \
    mkdir -p /target/usr/local/sbin /target/etc/systemd/system/multi-user.target.wants ; \
    cp /usr/share/press-to-reboot/press-to-reboot /target/usr/local/sbin/press-to-reboot ; \
    cp /usr/share/press-to-reboot/press-to-reboot.service /target/etc/systemd/system/press-to-reboot.service ; \
    ln -sf /etc/systemd/system/press-to-reboot.service /target/etc/systemd/system/multi-user.target.wants/press-to-reboot.service ; \
    chmod 755 /target/usr/local/sbin/press-to-reboot
